name: Sync uv.lock and requirements.txt

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/pyproject.toml"
      - "mcp-server/pyproject.toml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v7

      - name: Sync backend
        working-directory: backend
        run: uv lock && uv export --no-hashes --no-dev -o requirements.txt

      - name: Sync mcp-server
        working-directory: mcp-server
        run: uv lock && uv export --no-hashes --no-dev -o requirements.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock backend/requirements.txt mcp-server/uv.lock mcp-server/requirements.txt
          git diff --staged --quiet || git commit -m "build: sync uv.lock and requirements.txt"
          git push
